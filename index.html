<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perilune</title>
    <meta name="description" content="Build spacecraft, master credible orbital physics, land on distant moons, and bring your crew home in Perilune." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Perilune" />
    <meta property="og:description" content="Build spacecraft, master credible orbital physics, land on distant moons, and bring your crew home." />
    <meta property="og:image" content="__SITE_ORIGIN__/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Perilune" />
    <meta name="twitter:description" content="Build · Fly · Explore" />
    <meta name="twitter:image" content="__SITE_ORIGIN__/og.png" />
    <style>
      :root {
        --ui-bg: rgba(12, 18, 24, 0.82);
        --ui-fg: #d8e2ea;
        --ui-accent: #6db3d6;
        --ui-warn: #e2b13c;
        --ui-danger: #e06c50;
        --ui-good: #7fb8a4;
        --ui-font: 'Segoe UI', system-ui, sans-serif;
        --ui-mono: 'Cascadia Code', 'Consolas', monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #04070a; }
      body { font-family: var(--ui-font); color: var(--ui-fg); }
      #app { position: fixed; inset: 0; }
      #game-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #ui-root { position: absolute; inset: 0; pointer-events: none; }
      #ui-root > * { pointer-events: auto; }
      #boot {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px;
        background: radial-gradient(ellipse at 50% 60%, #0a1420 0%, #04070a 70%);
        z-index: 100; transition: opacity 0.4s;
      }
      #boot h1 { font-size: 42px; letter-spacing: 12px; font-weight: 300; color: var(--ui-accent); }
      #boot p { color: #7d8b96; font-size: 13px; letter-spacing: 2px; }
      #boot .bar { width: 240px; height: 3px; background: #1a2833; border-radius: 2px; overflow: hidden; }
      #boot .bar div { height: 100%; width: 0%; background: var(--ui-accent); transition: width 0.2s; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui-root"></div>
      <div id="boot">
        <h1>PERILUNE</h1>
        <p>SKYWARD COOPERATIVE FLIGHT SYSTEMS</p>
        <div class="bar"><div id="boot-progress"></div></div>
        <p id="boot-status">initializing</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
